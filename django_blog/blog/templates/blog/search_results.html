{% extends 'blog/base.html' %}
{% block title %}Search Results{% endblock %}

{% block content %}
<h2>Search results for "{{ query }}"</h2>
{% for post in results %}
    <div>
        <a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a>
        <p>{{ post.content|truncatechars:100 }}</p>
    </div>
{% empty %}
    <p>No results found.</p>
{% endfor %}
{% endblock %}
